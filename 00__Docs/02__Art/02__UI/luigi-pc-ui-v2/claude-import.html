<script>window.imageSource=path=>"https://blood-beans-luigi-ui.free-earth-2790.chatgpt.site/"+path;(() => {
  window.imageSource ||= path => path;
  const characters={vampire:{name:'흡혈귀',asset:'pcVampire'},zombie:{name:'좀비',asset:'pcZombie'},werewolf:{name:'늑대인간',asset:'pcWerewolf'},witch:{name:'마녀',asset:'pcWitch'}};
  // Add future screen definitions here, together with the four character images.
  const screens=[{id:'cafe',title:'낮 · 카페 운영',index:0},{id:'night',title:'밤 · 야간 탐색',index:1,bag:true},{id:'main-menu',title:'메인 메뉴',index:2},{id:'crew',title:'크루 선택',index:3}];
  const bags=['채집 주머니','탐색 배낭','랜턴 크로스백','유령 트렁크'];
  let character='vampire',bag=0;
  const container=document.getElementById('screens');
  function art(index){const span=document.createElement('span');span.className='bag-art';span.setAttribute('aria-hidden','true');span.style.backgroundPosition=(index%2*100)+'% '+(Math.floor(index/2)*100)+'%';return span;}
  screens.forEach(screen=>{
    const link=document.createElement('a');link.href='#'+screen.id;link.textContent=screen.title;document.getElementById('screen-nav').append(link);
    const section=document.createElement('section');section.id=screen.id;section.dataset.screen=screen.index;
    const heading=document.createElement('h2');heading.textContent=screen.title;section.append(heading);
    if(screen.bag){

      if(entry.overlay==='cue'){const label=document.createElement('strong');label.textContent=entry.states[state];overlay.append(label);}
      if(entry.overlay==='loading'){const label=document.createElement('strong');label.textContent=state?'다른 플레이어를 기다리는 중… 6 / 8':'불러오는 중…';overlay.append(label);}
      if(entry.overlay==='return'){const content=[['귀환 성공','소지한 아이템 100% 귀환','재료 8개를 팀 재고로 넘겼다'],['귀환 실패',`소지한 아이템 ${exampleReturn.lossPercent}% 소실 · 미회수 가방 전량 소실`,`소환 위치 밖에서 밤이 끝났다 · ${exampleReturn.lost}개 소실 / ${exampleReturn.kept}개 반입`],['가방 분실','획득 아이템 100% 소실','묻어 둔 가방을 회수하지 못했다']][state];content.forEach((text,i)=>{const line=document.createElement(i?'span':'strong');line.textContent=text;overlay.append(line);});}
    }
    note.textContent=extra?extra.note:view==='current'?'현재 Unity 프리팹에 샘플 데이터를 넣어 렌더링한 구현 비교 화면입니다. 실제 플레이 세션 캡처가 아니며, 3D 배경·모델 카메라는 갤러리용 미리보기입니다. '+(entry.id==='crew'?'현재 연결된 유령 모델을 보여주며, 배경 무대는 생략했습니다.':''):view==='concept'?(entry.redesign||entry.note):entry.note;
    source.textContent='정보·표시 조건 기준: '+entry.prefab.replace(/-(day|night|recipe)$/,'')+'.prefab'+(entry.board?' · 부품 비교 배치':' · PC 16:9')+(view==='current'?' · 2026-10-10 구현 프리팹 렌더링':'');
  }
  function setMode(next){mode=next;document.getElementById('project-gallery').hidden=next!=='project';nav.hidden=next!=='project';document.querySelector('.project-intro').hidden=next!=='project';document.getElementById('legacy-gallery').hidden=next!=='legacy';document.getElementById('legacy-nav').hidden=next!=='legacy';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===next)));}
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{setMode(b.dataset.mode);if(mode==='project')history.replaceState(null,'','#ui-'+selected);}));
  const hash=location.hash.slice(1);if(hash.startsWith('ui-')&&catalog.some(x=>x.id===hash.slice(3)))selected=hash.slice(3);else if(['cafe','night','main-menu','crew'].includes(hash))mode='legacy';
  render();setMode(mode);
})();
</script>
</body>
</html>
